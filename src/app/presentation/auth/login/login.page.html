<ion-content [fullscreen]="true">
  <div class="pantalla">
    <header class="fondo-huellas encabezado">
      <h1>Yupana</h1>
      <p>Cada voto, bien contado</p>
    </header>

    <form class="tarjeta" [formGroup]="form" (ngSubmit)="ingresar()" novalidate>
      <!-- Mascota colgada del borde del formulario (ADR-013) -->
      <div class="oso" [class.ojos-cerrados]="tapaOjos()" [class.sacudir]="sacudir()" aria-hidden="true">
        <img class="oso-capa oso-abierto" src="assets/osos/oso-colgando.webp" alt="" />
        <img class="oso-capa oso-cerrado" src="assets/osos/oso-colgando-cerrado.webp" alt="" />
        <img class="mariposa" src="assets/osos/oso-colgando-mariposa.webp" alt="" />
      </div>

      <h2>Iniciar sesión</h2>

      <ion-input formControlName="cedula" label="Cédula" labelPlacement="stacked" fill="outline" inputmode="numeric"
        maxlength="10" autocomplete="username" [errorText]="mensajeCedula()">
      </ion-input>

      <ion-input formControlName="clave" [type]="verClave() ? 'text' : 'password'" label="Contraseña"
        labelPlacement="stacked" fill="outline" autocomplete="current-password" errorText="Ingresa tu contraseña."
        (ionFocus)="claveEnfocada.set(true)" (ionBlur)="claveEnfocada.set(false)">
        <ion-button slot="end" fill="clear" (mousedown)="$event.preventDefault()" (click)="alternarClave()"
          [attr.aria-label]="verClave() ? 'Ocultar contraseña' : 'Mostrar contraseña'">
          <ion-icon slot="icon-only" [name]="verClave() ? 'eye-off' : 'eye'" aria-hidden="true"></ion-icon>
        </ion-button>
      </ion-input>

      @if (error()) {
      <p class="error-general" role="alert">{{ error() }}</p>
      }

      <ion-button type="submit" expand="block" [disabled]="cargando()">
        @if (cargando()) {
        <ion-spinner name="crescent"></ion-spinner>
        } @else {
        Ingresar
        }
      </ion-button>

      <a class="enlace" routerLink="/recuperar">¿Olvidaste tu contraseña?</a>
    </form>
  </div>
</ion-content>
